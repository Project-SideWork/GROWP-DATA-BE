version: "3.8"

services:
  growp:
    image: growp:${IMAGE_TAG}
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: ingress
    environment: APP_ENV=prod
      LOG_LEVEL=INFO
      BACKEND_BASE_URL=http://${SERVER_HOST}:8080
      REQUEST_TIMEOUT_SECONDS=10
      DELIVERY_MAX_ATTEMPTS=3
      BACKEND_FETCH_CONCURRENCY=5
      KAFKA_ENABLED=false
      KAFKA_BOOTSTRAP_SERVERS=${KAFKA_HOST}:${KAFKA_PORT}
      KAFKA_CLIENT_ID=growp-analysis-pipeline
      KAFKA_CONSUMER_GROUP_ID=growp-analysis-consumer
    secrets:
      - source: KAFKA_HOST
        target: KAFKA_HOST
      - source: KAFKA_PORT
        target: KAFKA_PORT
      - source: SERVER_HOST
        target: SERVER_HOST
    volumes:
      - type: bind
        source: /var/log/data
        target: /app/logs
    deploy:
      replicas: 1
      restart_policy:
        condition: any

secrets:
  KAFKA_HOST:
    external: true
  KAFKA_PORT:
    external: true
  SERVER_HOST:
    external: true
